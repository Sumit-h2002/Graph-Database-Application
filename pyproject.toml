[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-db-benchmark"
version = "1.0.0"
description = "A reproducible, honest, and rigorous graph database cloud benchmarking framework."
authors = [{ name = "Benchmark Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.10.0",
    "falkordb>=1.0.0",
    "kuzu>=0.4.0",
    "redis>=5.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/benchmark"]
omit = ["tests/*"]
